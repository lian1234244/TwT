<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TwT 测试机器人</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d12; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 22px; color: #fff; margin-bottom: 8px; }
.code-box { display: inline-block; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 12px 28px; }
.code-box .label { font-size: 12px; color: #999; margin-bottom: 4px; }
.code-box .code { font-size: 28px; font-weight: 700; letter-spacing: 6px; color: #4ade80; }
.status { text-align: center; margin: 12px 0; font-size: 14px; }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status .online { background: #4ade80; } .status .offline { background: #ff6b6b; }
.log { background: rgba(0,0,0,.4); border-radius: 10px; padding: 16px; height: 400px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 13px; line-height: 1.6; }
.log .entry { margin-bottom: 4px; }
.log .time { color: #666; } .log .info { color: #8ab4f8; } .log .ok { color: #4ade80; } .log .warn { color: #fbbf24; } .log .err { color: #ff6b6b; }
.log .entry:hover { background: rgba(255,255,255,.03); }
.hint { text-align: center; color: #999; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="header">
  <h1>TwT 测试机器人</h1>
  <div class="code-box">
    <div class="label">好友码（在 TwT 中添加这个码）</div>
    <div class="code" id="friend-code">TEST42</div>
  </div>
</div>
<div class="status"><span class="dot offline" id="status-dot"></span><span id="status-text">连接中...</span></div>
<div class="log" id="log"></div>
<div class="hint">这个机器人会自动同意好友申请和一起听邀请，直接在 TwT 里添加好友码即可测试</div>

<script>
const FRIEND_CODE = 'TEST42';
const MY_ID = 'twt_bot_test';
const MY_NAME = '测试机器人';
const CONFIG_URL = 'https://raw.githubusercontent.com/lian1234244/twt-signaling/main/server-config.json';

const pcMap = {};
const dcMap = {};
let ws = null;
let wsReady = false;
let ltRoom = null;

function log(msg, type) {
  type = type || 'info';
  const now = new Date();
  const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  const div = document.createElement('div');
  div.className = 'entry';
  div.innerHTML = '<span class="time">[' + time + ']</span> <span class="' + type + '">' + msg + '</span>';
  document.getElementById('log').appendChild(div);
  document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
}

function setStatus(online) {
  document.getElementById('status-dot').className = 'dot ' + (online ? 'online' : 'offline');
  document.getElementById('status-text').textContent = online ? '在线 · 等待好友请求' : '离线 · 重连中...';
}

function connect() {
  if (ws && ws.readyState <= 1) return;
  log('直连本地服务器 ws://localhost:8080', 'info');
  doConnect('ws://localhost:8080');
}

function doConnect(url) {
  try { ws = new WebSocket(url); } catch (e) { log('连接失败: ' + e.message, 'err'); return; }
  ws.onopen = () => {
    wsReady = true;
    log('已连接信令服务器', 'ok');
    ws.send(JSON.stringify({ type: 'register', friendCode: FRIEND_CODE, myId: MY_ID, name: MY_NAME }));
    log('已注册，好友码: ' + FRIEND_CODE, 'ok');
    setStatus(true);
  };
  ws.onclose = () => {
    wsReady = false;
    setStatus(false);
    log('连接断开，5秒后重连...', 'warn');
    setTimeout(connect, 5000);
  };
  ws.onerror = () => { wsReady = false; };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handleMessage(msg);
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'friendRequest':
      log('收到好友请求: ' + msg.name + ' (' + msg.fromCode + ')', 'info');
      ws.send(JSON.stringify({ type: 'friendAccept', to: msg.fromCode, fromCode: FRIEND_CODE, fromId: MY_ID, name: MY_NAME, avatar: '' }));
      log('已自动接受: ' + msg.name, 'ok');
      initP2P(msg.fromCode);
      break;
    case 'webrtc_offer': handleOffer(msg); break;
    case 'webrtc_answer':
      { const pc = pcMap[msg.fromCode]; if (pc) pc.setRemoteDescription(new RTCSessionDescription(msg.sdp)).catch(()=>{}); break; }
    case 'webrtc_ice':
      { const pc = pcMap[msg.fromCode]; if (pc) pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(()=>{}); break; }
    case 'status_update':
      log('好友 ' + msg.fromCode + ' 状态: ' + (msg.status || 'online') + (msg.song ? ' | ' + msg.song.name : ''), 'info');
      break;
    case 'friendOffline':
      log('好友 ' + msg.fromCode + ' 离线', 'warn');
      break;
  }
}

function initP2P(friendCode) {
  if (pcMap[friendCode]) return;
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  const dc = pc.createDataChannel('twt-sync', { ordered: true });
  setupDataChannel(dc, friendCode);
  dcMap[friendCode] = dc;
  pc.onicecandidate = (e) => {
    if (e.candidate && wsReady) ws.send(JSON.stringify({ type: 'webrtc_ice', to: friendCode, fromCode: FRIEND_CODE, candidate: e.candidate }));
  };
  pc.ondatachannel = (e) => { setupDataChannel(e.channel, friendCode); dcMap[friendCode] = e.channel; };
  pcMap[friendCode] = pc;
  pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
    if (wsReady) ws.send(JSON.stringify({ type: 'webrtc_offer', to: friendCode, fromCode: FRIEND_CODE, sdp: pc.localDescription }));
  }).catch(e => log('offer error: ' + e.message, 'err'));
}

function handleOffer(msg) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.onicecandidate = (e) => {
    if (e.candidate && wsReady) ws.send(JSON.stringify({ type: 'webrtc_ice', to: msg.fromCode, fromCode: FRIEND_CODE, candidate: e.candidate }));
  };
  pc.ondatachannel = (e) => { setupDataChannel(e.channel, msg.fromCode); dcMap[msg.fromCode] = e.channel; };
  pcMap[msg.fromCode] = pc;
  pc.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => pc.createAnswer()).then(a => pc.setLocalDescription(a)).then(() => {
    if (wsReady) ws.send(JSON.stringify({ type: 'webrtc_answer', to: msg.fromCode, fromCode: FRIEND_CODE, sdp: pc.localDescription }));
  }).catch(e => log('answer error: ' + e.message, 'err'));
}

function setupDataChannel(dc, friendCode) {
  dc.onopen = () => log('P2P 已连接: ' + friendCode, 'ok');
  dc.onclose = () => log('P2P 已断开: ' + friendCode, 'warn');
  dc.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
    handleP2P(msg, friendCode, dc);
  };
}

function handleP2P(msg, fromCode, dc) {
  switch (msg.type) {
    case 'lt_invite':
      log('收到一起听邀请: ' + msg.host + (msg.song ? ' | ' + msg.song.name + ' - ' + msg.song.artist : ''), 'info');
      dc.send(JSON.stringify({ type: 'lt_accept', roomCode: msg.roomCode }));
      ltRoom = { code: msg.roomCode, host: fromCode };
      log('已自动接受一起听邀请!', 'ok');
      break;
    case 'lt_sync':
    case 'lt_state':
      if (typeof msg.currentTime === 'number') log('同步: 时间=' + msg.currentTime.toFixed(1) + 's 播放=' + msg.playing, 'info');
      break;
    case 'lt_play': log('收到: 播放', 'info'); break;
    case 'lt_pause': log('收到: 暂停', 'info'); break;
    case 'lt_switch': log('收到: 切歌 -> ' + (msg.song ? msg.song.name + ' - ' + msg.song.artist : '?'), 'info'); break;
    case 'lt_chat': log('聊天: ' + msg.name + ': ' + msg.text, 'info'); break;
    case 'lt_leave': log('对方离开了一起听', 'warn'); ltRoom = null; break;
  }
}

connect();
</script>
</body>
</html>
